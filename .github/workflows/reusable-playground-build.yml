# =============================================================================
# Reusable Workflow: Playground 构建
#
# 构建 cherry-markdown playground 预览产物
# 产物: playground/ 目录 + pr-id.txt
# =============================================================================

name: 'Reusable: Playground Build'

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: echo ${{ github.event.number }} > pr-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr-id
          path: pr-id.txt
          retention-days: 5

      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version-file: '.node-version'
          cache: true

      - run: vp install

      - run: vp run build

      - name: Prepare playground
        run: |
          mkdir -p playground/packages/cherry-markdown/src
          cp -r packages/cherry-markdown/dist playground/packages/cherry-markdown
          cp packages/cherry-markdown/src/Cherry.config.js playground/packages/cherry-markdown/src/
          cp -r examples/assets playground
          cp examples/*.html playground
          [ -d examples/config_helper ] && cp -r examples/config_helper playground
          find playground -type f -name "*.html" -exec sed -i 's|\.\./packages|./packages|g' {} +

      - uses: actions/upload-artifact@v4
        with:
          name: playground
          path: playground
          retention-days: 5
