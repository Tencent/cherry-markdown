# =============================================================================
# Reusable Workflow: Playground 构建
#
# 构建 cherry-markdown playground 预览产物
# 产物: playground/ 目录 + pr-id.txt
# =============================================================================

name: 'Reusable: Playground Build'

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: echo ${{ github.event.number }} > pr-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr-id
          path: pr-id.txt
          retention-days: 5

      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: '.node-version'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'yarn'

      - run: vp install

      - run: vp run build

      - run: |
          mkdir -p playground/packages/cherry-markdown
          cp -r packages/cherry-markdown/dist playground/packages/cherry-markdown
          cp -r examples/assets playground
          cp examples/*.html playground
          # 可视化配置生成器（React 工程）：复制 Vite 构建产物到 playground/config_helper
          test -f examples/config_helper/dist/index.html || { echo "::error::config_helper 构建产物不存在"; exit 1; }
          mkdir -p playground/config_helper
          cp -r examples/config_helper/dist/. playground/config_helper/
          # 纯 HTML 示例引用的是 ../packages/...，playground 扁平化后需改为 ./packages/...
          # （config_helper 的产物已自带 cherry-markdown，且使用相对路径，不受影响）
          find playground -maxdepth 1 -type f -name "*.html" -exec sed -i 's|\.\./packages|./packages|g' {} +

      - uses: actions/upload-artifact@v4
        with:
          name: playground
          path: playground
          retention-days: 5
