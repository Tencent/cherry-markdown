# =============================================================================
# PR 测试 — 单元测试与浏览器交互
#
# 触发时机: 提交 PR 到 main 或 dev 分支，且修改相关包或共享构建配置时运行
# 功能: 通过 Vite+ 统一调度各包测试；Milkdown 补充完整浏览器测试
# 保留现有 workflow 和汇总 job 名称
# =============================================================================

name: 'PR: Unit Test'

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'packages/milkdown/**'
      - 'packages/cherry-markdown/**'
      # 共享依赖、构建输入和包元数据也会影响测试。
      - 'package.json'
      - 'yarn.lock'
      - '.node-version'
      - '.npmrc'
      - '.yarnrc*'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'build/**'
      - 'examples/**'
      - '.changeset/**'
      - '.github/workflows/pr-test.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version-file: '.node-version'
          cache: true
      - name: Install dependencies
        run: vp install

      - name: Test
        run: vp run test
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: |
            packages/cherry-markdown/coverage
            packages/milkdown/coverage
          if-no-files-found: ignore

  milkdown:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version-file: '.node-version'
          cache: true
      - name: Build Cherry and Milkdown artifacts
        run: |
          vp run -F cherry-markdown build
          vp run -F @cherry-markdown/milkdown build:demo:prepared
      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium
      - name: Browser interactions
        run: vp run -F @cherry-markdown/milkdown test:e2e --fully-parallel --workers=2
        env:
          MILKDOWN_E2E_DEMO_PREBUILT: '1'
      - name: Upload Milkdown diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: milkdown-diagnostics
          path: |
            packages/milkdown/playwright-report
            packages/milkdown/test-results
          if-no-files-found: ignore

  # Keep the existing required check name and fail if any suite did not succeed.
  milkdown-browser-consumer:
    if: ${{ always() }}
    needs: [test, milkdown]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Milkdown checks passed
        env:
          UNIT_RESULT: ${{ needs.test.result }}
          MILKDOWN_RESULT: ${{ needs.milkdown.result }}
        run: |
          set -eu
          test "$UNIT_RESULT" = success
          test "$MILKDOWN_RESULT" = success
