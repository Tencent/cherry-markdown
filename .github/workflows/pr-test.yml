# =============================================================================
# PR 测试 — 单元测试、浏览器交互与打包消费验证
#
# 触发时机: 提交 PR 到 main 或 dev 分支时自动运行
# 功能: 通过 Vite+ 统一调度各包测试；Milkdown 补充浏览器与消费验证
# 保留现有 workflow/job 名称，兼容分支保护中的必需检查
# =============================================================================

name: 'PR: Unit Test'

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version-file: '.node-version'
          cache: true
      - name: Install dependencies
        run: vp install

      - name: Test
        run: vp run test
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: |
            packages/cherry-markdown/coverage
            packages/milkdown/coverage
          if-no-files-found: ignore

  milkdown-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version-file: '.node-version'
          cache: true
      - name: Build Cherry and Milkdown artifacts
        run: |
          vp run -F cherry-markdown build
          vp run -F @cherry-markdown/milkdown build:demo:prepared
      - uses: actions/upload-artifact@v4
        with:
          name: milkdown-prepared-artifacts
          path: |
            packages/cherry-markdown/dist
            packages/milkdown/dist
            packages/milkdown/preview
          if-no-files-found: error
          retention-days: 5

  milkdown-browser:
    needs: milkdown-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version-file: '.node-version'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: milkdown-prepared-artifacts
          path: packages
      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium
      - name: Browser interactions
        run: vp exec playwright test --config packages/milkdown/playwright.config.ts --fully-parallel --shard=${{ matrix.shard }}/2
        env:
          MILKDOWN_E2E_DEMO_PREBUILT: '1'
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: milkdown-browser-diagnostics-${{ matrix.shard }}
          path: |
            packages/milkdown/playwright-report
            packages/milkdown/test-results
          if-no-files-found: ignore

  milkdown-consumer:
    needs: milkdown-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version-file: '.node-version'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: milkdown-prepared-artifacts
          path: packages
      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium
      - name: Verify packed consumers
        run: vp run -F @cherry-markdown/milkdown test:consumer:prepared

  # Keep the existing required check name and fail if any suite did not succeed.
  milkdown-browser-consumer:
    if: ${{ always() }}
    needs: [milkdown-prepare, milkdown-browser, milkdown-consumer]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Milkdown checks passed
        env:
          PREPARE_RESULT: ${{ needs.milkdown-prepare.result }}
          BROWSER_RESULT: ${{ needs.milkdown-browser.result }}
          CONSUMER_RESULT: ${{ needs.milkdown-consumer.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$CONSUMER_RESULT" = success
