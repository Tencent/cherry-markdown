# =============================================================================
# PR 测试 — 单元测试、浏览器交互与打包消费验证
#
# 触发时机: 提交 PR 到 main 或 dev 分支时自动运行
# 功能: 通过 Vite+ 统一调度各包测试；Milkdown 补充浏览器与消费验证
# 保留现有 workflow/job 名称，兼容分支保护中的必需检查
# =============================================================================

name: 'PR: Unit Test'

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  milkdown-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test Milkdown change detection
        run: bash .github/scripts/test-milkdown-changes.sh
      - name: Determine whether Milkdown checks are needed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/milkdown-changes.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version-file: '.node-version'
          cache: true
      - name: Install dependencies
        run: vp install

      - name: Test
        run: vp run test
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: |
            packages/cherry-markdown/coverage
            packages/milkdown/coverage
          if-no-files-found: ignore

  milkdown-prepare:
    needs: milkdown-changes
    if: ${{ needs.milkdown-changes.outputs.required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version-file: '.node-version'
          cache: true
      - name: Build Cherry and Milkdown artifacts
        run: |
          vp run -F cherry-markdown build
          vp run -F @cherry-markdown/milkdown build:demo:prepared
          vp run -F @cherry-markdown/milkdown prepare:ci-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: milkdown-demo-artifacts
          path: packages/milkdown/preview
          if-no-files-found: error
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with:
          name: milkdown-consumer-artifacts
          path: packages/milkdown/artifacts/consumer
          if-no-files-found: error
          retention-days: 5

  milkdown-browser:
    needs: milkdown-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version-file: '.node-version'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: milkdown-demo-artifacts
          path: packages/milkdown/preview
      - name: Verify demo artifact provenance
        run: vp run -F @cherry-markdown/milkdown verify:demo-artifact
      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium
      - name: Browser interactions
        run: vp run -F @cherry-markdown/milkdown test:e2e --fully-parallel --shard=${{ matrix.shard }}/2
        env:
          MILKDOWN_E2E_DEMO_PREBUILT: '1'
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: milkdown-browser-diagnostics-${{ matrix.shard }}
          path: |
            packages/milkdown/playwright-report
            packages/milkdown/test-results
          if-no-files-found: ignore

  milkdown-consumer:
    needs: milkdown-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version-file: '.node-version'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: milkdown-consumer-artifacts
          path: packages/milkdown/artifacts/consumer
      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium
      - name: Verify packed consumers
        run: vp run -F @cherry-markdown/milkdown test:consumer:ci
      - name: Upload consumer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: milkdown-consumer-diagnostics
          path: packages/milkdown/artifacts/diagnostics
          if-no-files-found: ignore

  # Keep the existing required check name and fail if any suite did not succeed.
  milkdown-browser-consumer:
    if: ${{ always() }}
    needs: [test, milkdown-changes, milkdown-prepare, milkdown-browser, milkdown-consumer]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Milkdown checks passed
        env:
          UNIT_RESULT: ${{ needs.test.result }}
          CHANGES_RESULT: ${{ needs.milkdown-changes.result }}
          MILKDOWN_REQUIRED: ${{ needs.milkdown-changes.outputs.required }}
          PREPARE_RESULT: ${{ needs.milkdown-prepare.result }}
          BROWSER_RESULT: ${{ needs.milkdown-browser.result }}
          CONSUMER_RESULT: ${{ needs.milkdown-consumer.result }}
        run: |
          set -eu
          test "$UNIT_RESULT" = success
          test "$CHANGES_RESULT" = success
          case "$MILKDOWN_REQUIRED" in
            true)
              test "$PREPARE_RESULT" = success
              test "$BROWSER_RESULT" = success
              test "$CONSUMER_RESULT" = success
              ;;
            false)
              test "$PREPARE_RESULT" = skipped
              test "$BROWSER_RESULT" = skipped
              test "$CONSUMER_RESULT" = skipped
              echo 'Milkdown browser and consumer checks skipped: changes are unrelated.'
              ;;
            *) echo 'Missing or invalid Milkdown change decision.' >&2; exit 1 ;;
          esac
