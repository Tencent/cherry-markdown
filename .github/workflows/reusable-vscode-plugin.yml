# =============================================================================
# Reusable Workflow: VSCode Plugin 构建 / 正式发布
#
# 模式 (mode):
#   "package"     — 改版本号 + 构建 + 打包 .vsix + 上传 artifact（PR Preview）
#   "release"     — 构建 + 打包 .vsix + 发布到 VS Marketplace 与 Open VSX
#
# 步骤:
#   1. 改版本号（package 模式加时间戳）
#   2. 安装依赖并构建插件
#   3. 类型检查、测试和产物验证
#   4. 准备隔离的 Marketplace 打包目录
#   5. 打包 / 上传 artifact / 双市场发布
# =============================================================================

name: 'Reusable: VSCode Plugin'

on:
  workflow_call:
    inputs:
      mode:
        description: '"package" | "release"'
        required: true
        type: string
      pr_number:
        description: 'package 模式下评论的 PR 编号'
        required: false
        type: number
        default: 0

jobs:
  vscode-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ inputs.mode == 'package' }}
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: '.node-version'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'yarn'

      # ── 1. 改版本号（package 加时间戳）──
      - name: Stamp preview version
        if: inputs.mode != 'release'
        run: |
          cd packages/vscodePlugin
          TS=$(date +%d%H%M | sed 's/^0*//')

          tmp=$(mktemp) && jq --arg ts "$TS" '
            .version |= (
              split(".") as $s |
              if ($s|length) < 3 then
                error("package.json version must be in '\''x.y.z'\'' format")
              else
                ($s[0:2] + [($s[2] | tonumber) * 1000000 + ($ts | tonumber)]) | join(".")
              end
            )
          ' package.json > "$tmp" && mv "$tmp" package.json

      # ── 2. 安装依赖 ──
      - name: Install Dependencies
        run: vp install

      # 核心库必须先生成 ESM/CSS，根脚本负责按顺序构建核心库和插件。
      - name: Build VSCode Plugin (production bundle)
        run: vp run build:vscodePlugin

      # ── 3. 类型检查、测试和产物验证 ──
      - name: Validate VSCode Plugin
        run: |
          vp run -F cherry-markdown-vscode-plugin typecheck
          vp run -F cherry-markdown-vscode-plugin test:unit
          vp run -F cherry-markdown-vscode-plugin test:package

      - name: Test VSCode Plugin in Extension Host
        run: xvfb-run -a vp run -F cherry-markdown-vscode-plugin test:integration

      # ── 4. 发布时才在隔离目录使用 Marketplace 名称，避免 Yarn workspace 重名。──
      - name: Prepare Marketplace Package
        run: |
          MARKETPLACE_DIR="$RUNNER_TEMP/cherry-markdown-vscode"
          mkdir -p "$MARKETPLACE_DIR"
          tar -C packages/vscodePlugin \
            --exclude='./node_modules' \
            --exclude='./.vscode-test' \
            --exclude='./out' \
            --exclude='./*.vsix' \
            -cf - . | tar -C "$MARKETPLACE_DIR" -xf -

          tmp=$(mktemp)
          jq '
            .name = "cherry-markdown" |
            del(.scripts["vscode:prepublish"])
          ' "$MARKETPLACE_DIR/package.json" > "$tmp"
          mv "$tmp" "$MARKETPLACE_DIR/package.json"

      # ── 5a. package 模式：打包 + 上传 artifact ──
      - name: Package VSCode Plugin
        if: inputs.mode == 'package'
        run: |
          MARKETPLACE_DIR="$RUNNER_TEMP/cherry-markdown-vscode"
          cd "$MARKETPLACE_DIR"
          VERSION=$(jq -r '.version' package.json)
          "$GITHUB_WORKSPACE/node_modules/.bin/vsce" package \
            --no-dependencies \
            --no-yarn \
            --out "$GITHUB_WORKSPACE/packages/vscodePlugin/cherry-markdown-$VERSION.vsix"
          cd "$GITHUB_WORKSPACE/packages/vscodePlugin"
          VSCODE_EXTENSION_NAME=cherry-markdown vp test run test/vsix.test.ts

      - name: Upload VSIX
        if: inputs.mode == 'package'
        uses: actions/upload-artifact@v4
        with:
          name: vscode-plugin-vsix
          path: packages/vscodePlugin/*.vsix
          retention-days: 5
          if-no-files-found: warn

      # ── 5b. release 模式：打包一次，同一 .vsix 发布到双市场 ──
      - name: Package VSIX (release)
        if: inputs.mode == 'release'
        run: |
          MARKETPLACE_DIR="$RUNNER_TEMP/cherry-markdown-vscode"
          cd "$MARKETPLACE_DIR"
          VERSION=$(jq -r '.version' package.json)
          "$GITHUB_WORKSPACE/node_modules/.bin/vsce" package \
            --no-dependencies \
            --no-yarn \
            --out "$GITHUB_WORKSPACE/packages/vscodePlugin/cherry-markdown-$VERSION.vsix"
          cd "$GITHUB_WORKSPACE/packages/vscodePlugin"
          VSCODE_EXTENSION_NAME=cherry-markdown vp test run test/vsix.test.ts
          ls -1 *.vsix

      - name: Publish to Visual Studio Marketplace
        if: inputs.mode == 'release'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          cd packages/vscodePlugin
          VSIX=$(ls -1 *.vsix | head -1)
          ../../node_modules/.bin/vsce publish --packagePath "$VSIX" --no-dependencies --no-yarn

      - name: Publish to Open VSX Registry
        if: inputs.mode == 'release'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          cd packages/vscodePlugin
          VSIX=$(ls -1 *.vsix | head -1)
          ../../node_modules/.bin/ovsx publish "$VSIX" --no-dependencies --no-yarn
