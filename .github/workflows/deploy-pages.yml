# =============================================================================
# Deploy: GitHub Pages — 文档站部署到 gh-pages 分支
#
# 触发时机: push 到 main 分支时自动运行
# 功能: 构建项目 → 打包 dist + examples → 部署到 gh-pages 分支
#       用户可通过 https://tencent.github.io/cherry-markdown/ 访问在线示例
# =============================================================================

name: 'Deploy: GitHub Pages'

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-github-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: '.node-version'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: vp install

      - name: Build project
        run: vp run build

      - name: Prepare publish directory
        run: |
          mkdir -p gh-pages-out

          cp --parents -r packages/cherry-markdown/dist gh-pages-out/
          cp --parents examples/*.html gh-pages-out/
          cp --parents -r examples/assets gh-pages-out/
          # 可视化配置生成器（React 工程）：只发布 Vite 构建产物，而不是源码
          # 产物由上一步 `vp run build` 生成于 examples/config_helper/dist，
          # 复制到同名目录后线上 URL 保持不变：
          #   https://tencent.github.io/cherry-markdown/examples/config_helper/
          test -f examples/config_helper/dist/index.html || { echo "::error::config_helper 构建产物不存在"; exit 1; }
          mkdir -p gh-pages-out/examples/config_helper
          cp -r examples/config_helper/dist/. gh-pages-out/examples/config_helper/
          # logo 资源也复制到 gh-pages-out 根目录
          cp -r logo gh-pages-out/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-out
          publish_branch: gh-pages
