# =============================================================================
# Release — 正式发布编排器
#
# 触发时机: push 到 main 分支（需有 changeset 变更）
# 功能:
#   - 使用 Changesets 进行版本管理和 tag 推送
#   - 按发布的包名分别调用子工作流:
#     • cherry-markdown → reusable-npm-release.yml
#     • @cherry-markdown/miniprogram → reusable-npm-release.yml
#     • @cherry-markdown/milkdown → reusable-npm-release.yml (after core)
#     • @cherry-markdown/client → reusable-client-build.yml (mode=release)
#     • cherry-markdown-vscode-plugin → reusable-vscode-plugin.yml (mode=release)
#   - 所有目标发布完成后创建 main → dev 同步 PR
# =============================================================================

name: 'Release'

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    # 不需要在fork仓库的pr中运行, 仅当pr合并时运行
    if: github.repository == 'Tencent/cherry-markdown'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      publishedClientVersion: ${{ steps.extract_version.outputs.clientVersion }}
      publishedCoreVersion: ${{ steps.extract_version.outputs.coreVersion }}
      publishedMiniProgramVersion: ${{ steps.extract_version.outputs.miniProgramVersion }}
      publishedMilkdownVersion: ${{ steps.extract_version.outputs.milkdownVersion }}
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version-file: '.node-version'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check for changesets
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn changeset-version
          title: 'chore: release'
          commit: 'chore: release'
          publish: yarn changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Version Output
        id: extract_version
        run: |
          clientVersion=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name=="@cherry-markdown/client") | .version')
          echo "clientVersion=$clientVersion" >> $GITHUB_OUTPUT

          coreVersion=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name=="cherry-markdown") | .version')
          echo "coreVersion=$coreVersion" >> $GITHUB_OUTPUT

          miniProgramVersion=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name=="@cherry-markdown/miniprogram") | .version')
          echo "miniProgramVersion=$miniProgramVersion" >> $GITHUB_OUTPUT

          milkdownVersion=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name=="@cherry-markdown/milkdown") | .version')
          echo "milkdownVersion=$milkdownVersion" >> $GITHUB_OUTPUT

          # Debugging output
          echo "publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}"
          echo "clientVersion=$clientVersion"
          echo "coreVersion=$coreVersion"
          echo "miniProgramVersion=$miniProgramVersion"
          echo "milkdownVersion=$milkdownVersion"

  build-core-release:
    needs: release
    if: ${{ contains(needs.release.outputs.publishedPackages, '"name":"cherry-markdown"') }}
    uses: ./.github/workflows/reusable-npm-release.yml
    with:
      package_name: 'cherry-markdown'
      package_dir: './packages/cherry-markdown'
      package_version: ${{ needs.release.outputs.publishedCoreVersion }}
      dist_asset_name: 'cherry-markdown'
      release_tag: 'cherry-markdown@${{ needs.release.outputs.publishedCoreVersion }}'
    secrets: inherit

  build-miniProgram-release:
    needs: release
    if: ${{ contains(needs.release.outputs.publishedPackages, '"name":"@cherry-markdown/miniprogram"') }}
    uses: ./.github/workflows/reusable-npm-release.yml
    with:
      package_name: '@cherry-markdown/miniprogram'
      package_dir: './packages/miniProgram'
      package_version: ${{ needs.release.outputs.publishedMiniProgramVersion }}
      dist_asset_name: 'cherry-markdown-mini-program'
      release_tag: '@cherry-markdown/miniprogram@${{ needs.release.outputs.publishedMiniProgramVersion }}'
    secrets: inherit

  build-milkdown-release:
    needs: [release, build-core-release]
    # A Milkdown-only release may skip core; a failed core publish must block it.
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' &&
          contains(needs.release.outputs.publishedPackages, '"name":"@cherry-markdown/milkdown"') &&
          (needs.build-core-release.result == 'success' || needs.build-core-release.result == 'skipped') }}
    uses: ./.github/workflows/reusable-npm-release.yml
    with:
      package_name: '@cherry-markdown/milkdown'
      package_dir: './packages/milkdown'
      package_version: ${{ needs.release.outputs.publishedMilkdownVersion }}
      dist_asset_name: 'cherry-markdown-milkdown'
      release_tag: '@cherry-markdown/milkdown@${{ needs.release.outputs.publishedMilkdownVersion }}'
      # The maintainer publishes 0.0.1 locally, then configures npm OIDC.
      publish_npm: ${{ needs.release.outputs.publishedMilkdownVersion != '0.0.1' }}

  build-client-release:
    needs: release
    if: ${{ contains(needs.release.outputs.publishedPackages, '"name":"@cherry-markdown/client"') }}
    uses: ./.github/workflows/reusable-client-build.yml
    with:
      mode: release
      client_version: ${{ needs.release.outputs.publishedClientVersion }}
    secrets: inherit

  build-vscodePlugin-release:
    needs: release
    if: ${{ contains(needs.release.outputs.publishedPackages, '"name":"cherry-markdown-vscode-plugin"') }}
    uses: ./.github/workflows/reusable-vscode-plugin.yml
    with:
      mode: release
    secrets: inherit

  # 等待所有发布任务完成；以工作流结果为准，未参与本次发布的任务允许跳过。
  sync-main-to-dev:
    needs: [release, build-core-release, build-miniProgram-release, build-milkdown-release, build-client-release, build-vscodePlugin-release]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' &&
          !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
          needs.release.outputs.publishedPackages != '' && needs.release.outputs.publishedPackages != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create or reuse sync PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid release commit SHA.');
            const branch = `release-sync/${sha}`;
            const comparison = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `dev...${sha}` });
            if (!Number.isInteger(comparison.data.ahead_by)) throw new Error('Invalid branch comparison.');
            if (comparison.data.ahead_by === 0) {
              core.info('dev already contains the release commit.');
              return;
            }
            const list = () => github.rest.pulls.list({ owner, repo, state: 'open', base: 'dev', head: `${owner}:${branch}` });
            const existing = await list();
            if (existing.data.length) {
              if (existing.data[0].head.sha !== sha) throw new Error('Existing sync PR points to a different commit.');
              core.info(`Existing sync PR: ${existing.data[0].html_url}`);
              return;
            }
            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha });
            } catch (error) {
              if (error.status !== 422) throw error;
              const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              if (ref.data.object.sha !== sha) throw new Error('Existing sync branch points to a different commit.');
            }
            try {
              const pr = await github.rest.pulls.create({
                owner, repo, base: 'dev', head: branch, title: 'chore: 同步发布版本到 dev',
                body: `将 main 的发布提交 \`${sha}\` 同步到 dev。请检查差异和冲突后再合并。\n\n发布流程：${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });
              core.info(`Created sync PR: ${pr.data.html_url}`);
            } catch (error) {
              if (error.status !== 422) throw error;
              const concurrent = await list();
              if (!concurrent.data.length || concurrent.data[0].head.sha !== sha) throw error;
              core.info(`Existing sync PR: ${concurrent.data[0].html_url}`);
            }

      - name: Record sync failure
        if: failure()
        run: echo 'Release synchronization was not completed. Inspect the failed step, reconcile any partially published packages, and rerun this job after resolving the cause.' >> "$GITHUB_STEP_SUMMARY"
