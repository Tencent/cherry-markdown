# =============================================================================
# Release — 正式发布编排器
#
# 触发时机: push 到 main 分支（需有 changeset 变更）
# 功能:
#   - 使用 Changesets 进行版本管理和 tag 推送
#   - 按发布的包名分别调用子工作流:
#     • cherry-markdown → reusable-npm-release.yml
#     • @cherry-markdown/miniprogram → reusable-npm-release.yml
#     • @cherry-markdown/client → reusable-client-build.yml (mode=release)
#     • cherry-markdown-vscode-plugin → reusable-vscode-plugin.yml (mode=release)
#   - 发布完成后强制同步 main → dev（仅在有包发布时执行）
# =============================================================================

name: 'Release'

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    # 不需要在fork仓库的pr中运行, 仅当pr合并时运行
    if: github.repository == 'Tencent/cherry-markdown'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      publishedClientVersion: ${{ steps.extract_version.outputs.clientVersion }}
      publishedCoreVersion: ${{ steps.extract_version.outputs.coreVersion }}
      publishedMiniProgramVersion: ${{ steps.extract_version.outputs.miniProgramVersion }}
      publishedEngineVersion: ${{ steps.extract_version.outputs.engineVersion }}
      publishedPreviewVersion: ${{ steps.extract_version.outputs.previewVersion }}
      publishedStreamVersion: ${{ steps.extract_version.outputs.streamVersion }}
      publishedMilkdownVersion: ${{ steps.extract_version.outputs.milkdownVersion }}
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: '.node-version'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install dependencies
        run: vp install

      - name: Check for changesets
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn changeset-version
          title: 'chore: release'
          commit: 'chore: release'
          publish: yarn changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Version Output
        id: extract_version
        run: |
          clientVersion=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name=="@cherry-markdown/client") | .version')
          echo "clientVersion=$clientVersion" >> $GITHUB_OUTPUT

          coreVersion=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name=="cherry-markdown") | .version')
          echo "coreVersion=$coreVersion" >> $GITHUB_OUTPUT

          miniProgramVersion=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name=="@cherry-markdown/miniprogram") | .version')
          engineVersion=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name=="@cherry-markdown/engine") | .version')
          previewVersion=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name=="@cherry-markdown/preview") | .version')
          streamVersion=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name=="@cherry-markdown/stream") | .version')
          milkdownVersion=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name=="@cherry-markdown/milkdown") | .version')
          echo "miniProgramVersion=$miniProgramVersion" >> $GITHUB_OUTPUT
          echo "engineVersion=$engineVersion" >> $GITHUB_OUTPUT
          echo "previewVersion=$previewVersion" >> $GITHUB_OUTPUT
          echo "streamVersion=$streamVersion" >> $GITHUB_OUTPUT
          echo "milkdownVersion=$milkdownVersion" >> $GITHUB_OUTPUT

          # Debugging output
          echo "publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}"
          echo "clientVersion=$clientVersion"
          echo "coreVersion=$coreVersion"
          echo "miniProgramVersion=$miniProgramVersion"

  build-core-release:
    needs: release
    if: ${{ contains(needs.release.outputs.publishedPackages, '"name":"cherry-markdown"') }}
    uses: ./.github/workflows/reusable-npm-release.yml
    with:
      package_name: 'cherry-markdown'
      package_dir: './packages/cherry-markdown'
      package_version: ${{ needs.release.outputs.publishedCoreVersion }}
      dist_asset_name: 'cherry-markdown'
      release_tag: 'cherry-markdown@${{ needs.release.outputs.publishedCoreVersion }}'
    secrets: inherit

  build-miniProgram-release:
    needs: release
    if: ${{ contains(needs.release.outputs.publishedPackages, '"name":"@cherry-markdown/miniprogram"') }}
    uses: ./.github/workflows/reusable-npm-release.yml
    with:
      package_name: '@cherry-markdown/miniprogram'
      package_dir: './packages/miniProgram'
      package_version: ${{ needs.release.outputs.publishedMiniProgramVersion }}
      dist_asset_name: 'cherry-markdown-mini-program'
      release_tag: '@cherry-markdown/miniprogram@${{ needs.release.outputs.publishedMiniProgramVersion }}'
    secrets: inherit

  build-engine-release:
    needs: release
    if: ${{ contains(needs.release.outputs.publishedPackages, '"name":"@cherry-markdown/engine"') }}
    uses: ./.github/workflows/reusable-npm-release.yml
    with:
      package_name: '@cherry-markdown/engine'
      package_dir: './packages/engine'
      package_version: ${{ needs.release.outputs.publishedEngineVersion }}
      dist_asset_name: 'cherry-markdown-engine'
      release_tag: '@cherry-markdown/engine@${{ needs.release.outputs.publishedEngineVersion }}'
    secrets: inherit

  build-preview-release:
    needs: [release, build-engine-release]
    if: ${{ always() && contains(needs.release.outputs.publishedPackages, '"name":"@cherry-markdown/preview"') && (needs.build-engine-release.result == 'success' || needs.build-engine-release.result == 'skipped') }}
    uses: ./.github/workflows/reusable-npm-release.yml
    with:
      package_name: '@cherry-markdown/preview'
      package_dir: './packages/preview'
      package_version: ${{ needs.release.outputs.publishedPreviewVersion }}
      dist_asset_name: 'cherry-markdown-preview'
      release_tag: '@cherry-markdown/preview@${{ needs.release.outputs.publishedPreviewVersion }}'
    secrets: inherit

  build-stream-release:
    needs: [release, build-engine-release, build-preview-release]
    if: ${{ always() && contains(needs.release.outputs.publishedPackages, '"name":"@cherry-markdown/stream"') && (needs.build-engine-release.result == 'success' || needs.build-engine-release.result == 'skipped') && (needs.build-preview-release.result == 'success' || needs.build-preview-release.result == 'skipped') }}
    uses: ./.github/workflows/reusable-npm-release.yml
    with:
      package_name: '@cherry-markdown/stream'
      package_dir: './packages/stream'
      package_version: ${{ needs.release.outputs.publishedStreamVersion }}
      dist_asset_name: 'cherry-markdown-stream'
      release_tag: '@cherry-markdown/stream@${{ needs.release.outputs.publishedStreamVersion }}'
    secrets: inherit

  build-milkdown-release:
    needs: [release, build-engine-release]
    if: ${{ always() && contains(needs.release.outputs.publishedPackages, '"name":"@cherry-markdown/milkdown"') && (needs.build-engine-release.result == 'success' || needs.build-engine-release.result == 'skipped') }}
    uses: ./.github/workflows/reusable-npm-release.yml
    with:
      package_name: '@cherry-markdown/milkdown'
      package_dir: './packages/milkdown'
      package_version: ${{ needs.release.outputs.publishedMilkdownVersion }}
      dist_asset_name: 'cherry-markdown-milkdown'
      release_tag: '@cherry-markdown/milkdown@${{ needs.release.outputs.publishedMilkdownVersion }}'
    secrets: inherit

  build-client-release:
    needs: release
    if: ${{ contains(needs.release.outputs.publishedPackages, '"name":"@cherry-markdown/client"') }}
    uses: ./.github/workflows/reusable-client-build.yml
    with:
      mode: release
      client_version: ${{ needs.release.outputs.publishedClientVersion }}
    secrets: inherit

  build-vscodePlugin-release:
    needs: release
    if: ${{ contains(needs.release.outputs.publishedPackages, '"name":"cherry-markdown-vscode-plugin"') }}
    uses: ./.github/workflows/reusable-vscode-plugin.yml
    with:
      mode: release
    secrets: inherit

  # 仅当有实际版本发布时才同步 main 到 dev，避免意外覆盖 dev
  sync-main-to-dev:
    needs: release
    if: needs.release.outputs.publishedPackages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Sync main to dev
        run: |
          git fetch origin dev
          git checkout -B dev origin/main
          git push origin dev --force
