# =============================================================================
# PR: CI Check — ESLint 代码规范检查 + 多版本 Node 构建验证
#
# 触发时机: push 到 main/dev 分支 / 提交 PR 时自动运行
# 功能: 在 Node 22/24 两个版本上分别执行 lint 和 build，确保跨版本兼容性
# 并发控制: 同一分支的连续提交会取消旧的运行，节省 CI 资源
# =============================================================================

name: 'PR: CI Check'

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: ['22.18.0', '24.15.0', lts/*]
        # 22.18.0: Vite+ 工具链支持的 Node 22 最低版本
        # 24.15.0: 固定开发和发布基准版本
        # lts/*: 当前最新 Active LTS（自动跟随）

    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version: ${{ matrix.node-version }}
          cache: true
      - name: Install dependencies
        run: vp install

      - name: Verify toolchain alignment
        run: vp run check:toolchain

      - name: Lint
        run: vp run lint

      - name: Typecheck
        run: vp run typecheck

      - name: Build
        run: vp run build

      - name: Verify Cherry Markdown published artifacts
        run: vp run -F cherry-markdown test:artifacts

      - name: Verify native MiniProgram artifacts
        run: vp run -F @cherry-markdown/miniprogram test:artifact

      - name: Verify packed semantic bridge and native adapter
        run: vp run -F @cherry-markdown/miniprogram test:bridge
