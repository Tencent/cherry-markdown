# =============================================================================
# PR: CI Check — ESLint 代码规范检查 + 多版本 Node 构建验证
#
# 触发时机: push 到 main/dev 分支 / 提交 PR 时自动运行
# 功能: 在 Node 22/24 两个版本上分别执行 lint 和 build，确保跨版本兼容性
# 并发控制: 同一分支的连续提交会取消旧的运行，节省 CI 资源
# =============================================================================

name: 'PR: CI Check'

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [22.x, 24.x, lts/*]
        # 22.x: package.json engines 声明的最低支持版本
        # 24.x: 固定开发基准版本
        # lts/*: 当前最新 Active LTS（自动跟随）

    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: vp install

      - name: Lint
        run: vp run lint

      - name: Package boundaries
        run: vp run check:boundaries

      - name: Typecheck
        run: vp run typecheck

      - name: Build
        run: vp run build

      - name: Verify new package demos
        run: vp run verify:demos

      - name: Verify package artifacts
        run: vp run verify:packages

      - name: Verify Cherry Markdown published artifacts
        run: vp run -F cherry-markdown test:artifacts

      - name: Cache Playwright Chromium
        if: matrix.node-version == '22.x'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.62.1

      - name: Install Chromium
        if: matrix.node-version == '22.x'
        run: npx playwright install --with-deps chromium

      - name: Browser package acceptance
        if: matrix.node-version == '22.x'
        run: vp run test:browser

      - name: Upload browser failure evidence
        if: failure() && matrix.node-version == '22.x'
        uses: actions/upload-artifact@v6
        with:
          name: browser-acceptance-${{ matrix.node-version }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
