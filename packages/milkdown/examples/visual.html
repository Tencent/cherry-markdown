<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cherry Milkdown visual contract</title>
    <style>
      body {
        display: flex;
        margin: 0;
        background: #fff;
      }
      .comparison {
        box-sizing: border-box;
        flex: 0 0 720px;
        width: 720px;
        height: 920px;
        overflow: hidden;
      }
      .comparison .cherry {
        height: 100%;
      }
      .comparison .cherry-toolbar,
      .comparison .cherry-editor,
      .comparison .cherry-drag {
        display: none !important;
      }
      .comparison .cherry-previewer {
        width: 100% !important;
        height: 100% !important;
        padding: 24px;
      }
      .cherry-node-actions,
      .cherry-embed__controls,
      .cherry-embed__source {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <section id="native" class="comparison"></section>
    <section id="milkdown" class="comparison"></section>
    <script type="module" src="./visual.js"></script>
  </body>
</html>
