<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>【new】Preview 独立包</title>
    <style>
      body { max-width: 1080px; margin: 32px auto; padding: 0 20px; font: 14px/1.6 system-ui; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      textarea, #preview { box-sizing: border-box; width: 100%; min-height: 360px; padding: 16px; border: 1px solid #ddd; }
      code { background: #f2f3f5; padding: 2px 4px; }
      .status { color: #087443; }
    </style>
  </head>
  <body>
    <h1>【new】@cherry-markdown/preview</h1>
    <p>直接调用 <code>setMarkdown/getMarkdown/getHtml/refresh/destroy</code>，不手工调用 Engine。</p>
    <p id="status" class="status"></p>
    <main><textarea id="markdown"># Preview

这是 **纯预览包**。

| API | 状态 |
| --- | --- |
| setMarkdown | working |</textarea><div id="preview"></div></main>
    <button id="refresh">refresh</button> <button id="destroy">destroy</button>
    <script type="module">
      import Preview from '@cherry-markdown/preview';

      const input = document.querySelector('#markdown');
      const status = document.querySelector('#status');
      const preview = new Preview({ previewerDom: document.querySelector('#preview') });
      window.__cherryNewDemo = { preview };
      const render = () => {
        preview.setMarkdown(input.value);
        status.textContent = `【new】markdown=${preview.getMarkdown().length} chars，html=${preview.getHtml().length} chars`;
        document.body.dataset.demoReady = 'true';
      };
      input.addEventListener('input', render);
      document.querySelector('#refresh').addEventListener('click', () => preview.refresh(preview.getHtml()));
      document.querySelector('#destroy').addEventListener('click', () => { preview.destroy(); status.textContent = '【new】destroy 已调用'; });
      render();
    </script>
  </body>
</html>
